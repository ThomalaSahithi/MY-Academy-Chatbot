<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Academy AI Chatbot</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif;
color: #14334c; background: #edf6fa; }
header { background: #102b49; color: white;
padding: 22px; text-align: center; }
main { max-width: 850px; margin: 30px auto; padding: 20px; }
h1 { color: #0a6f90; }
#n8n-chat { width: 100%; height: 550px;
background: white; border-radius: 12px;
overflow: hidden; box-shadow: 0 8px 30px #1232; }
@media (max-width: 600px) {
main { margin: 8px auto; padding: 12px; }
#n8n-chat { height: 70vh; min-height: 430px; }
}
</style>
</head>
<body>
<header><h2>My Academy</h2></header>
<main>
<h1>Ask our AI Assistant</h1>
<p>Ask about our courses and learning options.</p>
<div id="n8n-chat"></div>
</main>
<script type="module">
import { createChat } from
'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';
createChat({
webhookUrl: 'https://sahithi1632.app.n8n.cloud/webhook/5625667c-eca7-45ec-9fb5-385eaa07d6b9/chat',
target: '#n8n-chat',
mode: 'fullscreen',
showWelcomeScreen: false,
initialMessages: [
'Hi! Welcome to My Academy. How can I help?'
]
});
</script>
</body>
</html>
